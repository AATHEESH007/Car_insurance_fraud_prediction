version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraud_detection}
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraud_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fraud_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fraud_detection}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10485760}
      FRAUD_MEDIUM_THRESHOLD: ${FRAUD_MEDIUM_THRESHOLD:-0.40}
      FRAUD_HIGH_THRESHOLD: ${FRAUD_HIGH_THRESHOLD:-0.70}
      MODEL_PATH: ${MODEL_PATH:-model/weights/best_efficientnetv2_s.pth}
      FLASK_ENV: ${FLASK_ENV:-production}
    volumes:
      - model_weights:/app/model/weights:ro
      - uploads_data:/app/uploads
    ports:
      - "${PORT:-8000}:8000"

volumes:
  postgres_data:
  model_weights:
  uploads_data:
